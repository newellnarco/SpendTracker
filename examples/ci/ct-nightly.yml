# Copy to .github/workflows/ct-nightly.yml. Continuous testing: runs without a push.
name: ct-nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run st adapter test --all --strict
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pytest tests/migrations -m "not live"
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pytest tests/perf --benchmark-compare-fail=mean:20%
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: pipx install dist/*.whl && st doctor
        shell: bash
  live:
    # Runs only where read-only vendor tokens exist. Never writes to any vendor.
    if: ${{ vars.CT_LIVE_ENABLED == 'true' }}
    runs-on: [self-hosted, spendtracker-ct]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pytest --live tests/live
        env:
          GITHUB_BILLING_TOKEN: ${{ secrets.GITHUB_BILLING_TOKEN }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
  report:
    needs: [replay, migrations, perf, install]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `ct: nightly failure ${new Date().toISOString().slice(0,10)}`;
            const issues = await github.rest.issues.listForRepo({...context.repo, labels: 'ct', state: 'open'});
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (issues.data.length) {
              await github.rest.issues.createComment({...context.repo, issue_number: issues.data[0].number, body});
            } else {
              await github.rest.issues.create({...context.repo, title, body, labels: ['ct']});
            }
